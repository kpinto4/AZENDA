<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      /** Build viejo en producción apunta a api.tu-dominio.com → reescribe a /api (mismo origen, sin CORS). */
      function fixApiUrl(url) {
        if (typeof url !== 'string' || !/api\.tu-dominio\.com/i.test(url)) return url;
        try {
          var parsed = new URL(url, location.origin);
          return parsed.pathname + parsed.search + parsed.hash;
        } catch (e) {
          return url.replace(/https?:\/\/api\.tu-dominio\.com/i, '');
        }
      }
      window.__AZENDA_API_BASE__ = '/api';
      var nativeFetch = window.fetch;
      if (nativeFetch) {
        window.fetch = function (input, init) {
          if (typeof input === 'string') {
            input = fixApiUrl(input);
          } else if (input instanceof Request) {
            input = new Request(fixApiUrl(input.url), input);
          }
          return nativeFetch.call(this, input, init);
        };
      }
      var xhrOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        arguments[1] = fixApiUrl(url);
        return xhrOpen.apply(this, arguments);
      };
    })();
  </script>
  <title>Azenda — Citas, ventas e inventario</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
</head>
<body>

</body>
</html>
